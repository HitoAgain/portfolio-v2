# Publishes the site to GitHub Pages on every push to main.
# assets/firebase-config.js is not in git (keeps the key out of the repo); it is written here from the
# FIREBASE_CONFIG_JS repository secret, which holds the whole file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Write Firebase config from secret
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JS" ]; then echo "::error::Add the FIREBASE_CONFIG_JS repository secret"; exit 1; fi
          printf '%s\n' "$FIREBASE_CONFIG_JS" > assets/firebase-config.js

      - name: Collect only the website files
        run: |
          mkdir _site
          cp -r index.html works.html about.html contact.html assets _site/
          # Stamp each deploy's commit on local CSS/JS links so browsers fetch the new files, not cached old ones.
          v=${GITHUB_SHA::7}
          sed -i -E "s#(href|src)=\"assets/([a-z-]+\.(css|js))\"#\1=\"assets/\2?v=$v\"#g" _site/*.html
          sed -i -E "s#from '\./([a-z-]+\.js)'#from './\1?v=$v'#g; s#import\('\./([a-z-]+\.js)'\)#import('./\1?v=$v')#g" _site/assets/works.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes can't see the just-uploaded files yet ("No artifacts named github-pages");
      # waiting and trying once more fixes it.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
